[pytest]
testpaths = tests
python_files = test_*.py
# The API's own imports are bare (`from models.base import Base`), so the package
# root has to be importable. conftest.py inserts it; this keeps `pytest` working
# from either the repo root or this directory.
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
