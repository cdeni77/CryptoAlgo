[pytest]
cache_dir = /tmp/pytest_cache_cryptoalgo

# Parallel by default. The suite is dominated by four promotion and walk-forward
# evaluations that each train models for a minute or more; serially that is
# nearly ten minutes, and across four workers it is under six. LightGBM is
# already pinned to `n_jobs: 1` in core/model.py, so the workers do not
# oversubscribe the cores.
#
# `-n auto` matches the machine. Use `-n 0` to force serial when a traceback or
# a debugger matters, and `-m "not slow"` for the fast loop.
addopts = -n auto
markers =
    slow: end-to-end runs that train models; minutes rather than seconds
