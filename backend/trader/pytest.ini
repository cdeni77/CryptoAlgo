[pytest]
cache_dir = /tmp/pytest_cache_cryptoalgo

# Parallel by default. The slowest tests train real models — the end-to-end
# walk-forward in test_walk_forward_end_to_end.py and the shrinkage checks in
# test_features_and_model.py — and LightGBM is pinned to `n_jobs: 1` in
# core/model.py, so the workers do not oversubscribe the cores.
#
# This comment used to describe "four promotion and walk-forward evaluations",
# which was a suite that did not exist: nothing imported core/backtest.py at all
# (158 statements, 0% coverage) and no test carried the `slow` marker, so
# `-m "not slow"` was a no-op. Both are true now.
#
# `-n auto` matches the machine. Use `-n 0` to force serial when a traceback or
# a debugger matters, and `-m "not slow"` for the fast loop.
# **`--dist loadfile`, not the default `--dist load`.** xdist caches a fixture
# per WORKER, and the default scatters a file's tests round-robin, so a
# module-scoped fixture is rebuilt on every worker that gets one of its tests.
# Measured 2026-10-28: `test_walk_forward_end_to_end.py` built its fixtures
# SEVEN times and `test_stacked_model.py` twice. Pinning a file to one worker
# took those to two and one, and the suite from 12m42s to 10m23s -- both runs
# under heavy contention, so that is a floor.
#
# `-n 0` when iterating on one file: `-n auto` spends ~4.2s starting workers
# before a single assertion runs.
addopts = -n auto --dist loadfile
markers =
    slow: end-to-end runs that train models; minutes rather than seconds
