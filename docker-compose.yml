services:
  # ===========================================================================
  # PostgreSQL — trade history database (for the API/frontend)
  # ===========================================================================
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # No default. A compose file with a working password in it is a password
      # in version control, and this one is reachable from the network below.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-trades_db}
    ports:
      # Bound to the loopback interface. Without the 127.0.0.1 prefix Docker
      # publishes on every interface and punches through the host firewall,
      # which put the trade database on the local network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ===========================================================================
  # Backend API — FastAPI serving prices, trades, wallet to the frontend
  # ===========================================================================
  backend:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    ports:
      # Loopback only: the API serves a local dashboard and has one endpoint
      # that starts a process.
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-trades_db}
      - COINBASE_API_KEY=${COINBASE_API_KEY:-}
      - COINBASE_API_SECRET=${COINBASE_API_SECRET:-}
      - TRADER_DIR=/trader
      - LEDGER_WALLETS_JSON=${LEDGER_WALLETS_JSON:-'[]'}
      # Shared secret for POST /research/launch, which starts a process in a
      # container holding the exchange keys. Unset means that route returns 503
      # — it fails closed rather than running unauthenticated.
      - API_TOKEN=${API_TOKEN:-}
      # Comma-separated. `*` is filtered out: it made every other entry
      # decorative and let any open page call the API with credentials.
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/api:/app
      - ./backend/trader:/trader
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload

  # ===========================================================================
  # Frontend — React/Vite dashboard
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    environment:
      # The browser makes these requests, not the container, so this has to be
      # an address the browser can reach. `http://backend:8000` is the
      # Docker-internal hostname and resolves nowhere outside the compose
      # network — every API call from the built frontend failed.
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
      - VITE_API_TOKEN=${API_TOKEN:-}

  # ===========================================================================
  # Trader — the research pipeline (scrape → features → signals), plus retraining
  #
  # Each cycle, scripts.live_orchestrator runs:
  #   run_pipeline  →  migrate_to_research_store  →  build_features  →  signals
  #
  # Retraining is on its own cadence (RETRAIN_EVERY_DAYS) and goes through
  # scripts.promote, which installs a candidate only if every promotion gate in
  # core/metrics.py passes. A blocked candidate leaves the previous model live
  # and records why in models/promotions/.
  #
  # Configurable via environment variables (see defaults below).
  # ===========================================================================
  trader:
    build:
      context: ./backend/trader
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - COINBASE_API_KEY=${COINBASE_API_KEY:-}
      - COINBASE_API_SECRET=${COINBASE_API_SECRET:-}
      - TRADER_DIR=/trader
      # Timezone
      - TZ=America/New_York

      # Pipeline database (SQLite inside the container, persisted via volume)
      - TRADER_DB_PATH=/app/data/trading.db
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-trades_db}

      # Research store (Parquet + DuckDB), rebuilt from the scraper DB
      - RESEARCH_STORE=/app/data/research

      # Venue. Coinbase supplies the traded price; the reference venue is a
      # deeper market used only for basis and lead-lag features.
      - TRADE_VENUE=coinbase
      - REFERENCE_VENUE=binance

      # The real CDE fee schedule, resolved by name out of configs/exchange.
      # Without it every contract is priced at the hardcoded 10bp/side, which is
      # wrong by 0.06x-2.5x depending on the contract — in both directions, so it
      # inverts the ranking between coins. `configs/` lives inside
      # backend/trader precisely so the Docker build context includes it.
      - COST_CONFIG=coinbase_us_perps_cde_v202602.json

      - LEVERAGE=4
      - EQUITY=100000

      # Scheduling
      - CYCLE_INTERVAL_SECONDS=3600          # Max cycle interval (fallback)
      - CYCLE_ALIGN_MINUTE=3                 # Run at :03 past every hour (1:03, 2:03, ...)
      - INCREMENTAL_BACKFILL_HOURS=6         # Fetch last 6h of data each cycle
      - RETRAIN_EVERY_DAYS=7                 # How long a promoted model stays live
      - WALK_FORWARD_PERIODS=6               # Out-of-sample stretches per evaluation

      # Logging
      - LOG_LEVEL=INFO

      # Optional: HTTP proxy for exchange API calls
      # - HTTPS_PROXY=http://your-proxy:8080
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, psycopg2; psycopg2.connect(os.environ['DATABASE_URL'].replace('postgresql+psycopg2://', 'postgresql://')).close(); print('ok')\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      # Persist the SQLite DB, trained models, feature CSVs, and logs across restarts
      - trader_data:/app/data
      - trader_models:/app/models
      - trader_logs:/app/logs
      # Mount source for development (remove in production)
      - ./backend/trader:/app
      # `configs/` already lives inside backend/trader, so the bind mount above
      # brings it in. Mounting a repo-root `./configs` here created an empty
      # host directory and masked the real one, which is exactly the bug the
      # note above describes: find_cost_config() then found nothing and every
      # contract was priced at the hardcoded default.
      # Paper candidate overrides (optimizer results) — overlays the named volume subdir
      - ./backend/trader/data/paper_candidates:/app/data/paper_candidates
    # The orchestrator: initial backfill (30d) then hourly cycles
    command: >
      -m scripts.live_orchestrator
        --backfill-days 30
        --include-oi

  # ===========================================================================
  # Paper Engine — consumes signals from PostgreSQL and simulates fills
  # ===========================================================================
  paper-engine:
    build:
      context: ./backend/trader
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-trades_db}
      - TZ=America/New_York
      # The paper engine accrues funding from the research store and prices
      # fills from the venue fee schedule. With neither set it read an empty
      # store (so funding was silently never accrued) and fell back to the
      # hardcoded 10bp/side — the two failures its own docstring exists to fix.
      - RESEARCH_STORE=/app/data/research
      - COST_CONFIG=coinbase_us_perps_cde_v202602.json
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
      trader:
        condition: service_started
    volumes:
      # The store the orchestrator writes is the store this reads.
      - trader_data:/app/data
      - ./backend/trader:/app
    command: >
      -m scripts.paper_engine
        --poll-seconds 5
        --max-signal-age-minutes 60

  # ===========================================================================
  # Trader — one-off evaluation (runs once, then exits)
  #
  # Uncomment to walk-forward backtest a candidate, run the simulation stack and
  # print the promotion gates without installing anything. Swap the command for
  # `python -m scripts.promote` to install it if the gates pass, or
  # `python -m scripts.preflight` to check whether the data can train at all.
  # ===========================================================================
  # trader-evaluate:
  #   build:
  #     context: ./backend/trader
  #     dockerfile: Dockerfile
  #   environment:
  #     - TRADER_DB_PATH=/app/data/trading.db
  #     - RESEARCH_STORE=/app/data/research
  #     - LOG_LEVEL=INFO
  #   volumes:
  #     - trader_data:/app/data
  #     - trader_models:/app/models
  #     - trader_logs:/app/logs
  #     - ./backend/trader:/app
  #   command: >
  #     python -m scripts.backtest
  #       --full
  #       --venue coinbase
  #       --cost-config coinbase_us_perps_cde_v202602.json

volumes:
  postgres_data:
  trader_data:
  trader_models:
  trader_logs:
