services:
  # ===========================================================================
  # PostgreSQL — trade history database (for the API/frontend)
  # ===========================================================================
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # No default. A compose file with a working password in it is a password
      # in version control, and this one is reachable from the network below.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-trades_db}
    ports:
      # Bound to the loopback interface. Without the 127.0.0.1 prefix Docker
      # publishes on every interface and punches through the host firewall,
      # which put the trade database on the local network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ===========================================================================
  # Backend API — FastAPI serving prices, trades, wallet to the frontend
  # ===========================================================================
  backend:
    restart: unless-stopped
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    ports:
      # Loopback only: the API serves a local dashboard and has one endpoint
      # that starts a process.
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-trades_db}
      - COINBASE_API_KEY=${COINBASE_API_KEY:-}
      - COINBASE_API_SECRET=${COINBASE_API_SECRET:-}
      - TRADER_DIR=/trader
      # No quotes around the default: `json.loads("'[]'")` raises, and the
      # exception is swallowed, so a quoted default was indistinguishable from
      # "not configured" — as would be a typo in a real wallet list.
      - LEDGER_WALLETS_JSON=${LEDGER_WALLETS_JSON:-[]}
      # Shared secret for POST /research/launch, which starts a process in a
      # container holding the exchange keys. Unset means that route returns 503
      # — it fails closed rather than running unauthenticated.
      - API_TOKEN=${API_TOKEN:-}
      # Comma-separated. `*` is filtered out: it made every other entry
      # decorative and let any open page call the API with credentials.
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/api:/app
      - ./backend/trader:/trader
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload

  # ===========================================================================
  # Frontend — React/Vite dashboard
  # ===========================================================================
  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Build arguments, not runtime environment: Vite inlines VITE_* at build
      # time, so a runtime value on a static nginx image reaches nothing.
      args:
        # Default to the relative path nginx already proxies to the backend,
        # which makes the bundle host-agnostic.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_API_TOKEN: ${API_TOKEN:-}
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    # No runtime environment. Vite inlines `import.meta.env.VITE_*` at BUILD
    # time, so values set here on an nginx image serving a finished bundle are
    # silently ignored — what actually got baked in was the committed
    # `frontend/.env`, which is why every deployment pointed at localhost:8000
    # and the API token was always absent. They are `build.args` above now.
    # The default `/api` is a relative path that `nginx.conf` already proxies to
    # the backend, so the bundle no longer hardcodes a host at all.
    # `frontend/.env` still applies to `npm run dev`.

  # ===========================================================================
  # Trader — the research pipeline (scrape → features → signals), plus retraining
  #
  # Each cycle, scripts.live_orchestrator runs:
  #   run_pipeline  →  migrate_to_research_store  →  build_features  →  signals
  #
  # Retraining is on its own cadence (RETRAIN_EVERY_DAYS) and goes through
  # scripts.promote, which installs a candidate only if every promotion gate in
  # core/metrics.py passes. A blocked candidate leaves the previous model live
  # and records why in models/promotions/.
  #
  # Configurable via environment variables (see defaults below).
  # ===========================================================================
  trader:
    build:
      context: ./backend/trader
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - COINBASE_API_KEY=${COINBASE_API_KEY:-}
      - COINBASE_API_SECRET=${COINBASE_API_SECRET:-}
      - TRADER_DIR=/trader
      # Timezone
      - TZ=America/New_York

      # Pipeline database (SQLite inside the container, persisted via volume)
      - TRADER_DB_PATH=/app/data/trading.db
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-trades_db}

      # Research store (Parquet + DuckDB), rebuilt from the scraper DB
      - RESEARCH_STORE=/app/data/research

      # Venue. Coinbase supplies the traded price; the reference venue is a
      # deeper market used only for basis and lead-lag features.
      #
      # Coinbase spot, not Binance. Binance, OKX and Bybit all answer HTTP 451 to
      # a US IP, so `binance` here resolved to no bars at all and the seven
      # cross_venue features arrived as all-NaN columns — which build_panel
      # reindexes into the canonical 76, so the panel keeps its shape and the
      # feature_set_hash is identical to a populated one. Coinbase's own spot book
      # is deeper than the nano perp, reachable without a proxy, and is the market
      # the perp's index is built from, which makes its basis the thing that
      # actually drives funding. The orchestrator refreshes it each cycle
      # (`_scrape_reference`) only when this is `coinbase_spot`.
      - TRADE_VENUE=coinbase
      - REFERENCE_VENUE=coinbase_spot

      # The real CDE fee schedule, resolved by name out of configs/exchange.
      # Without it every contract is priced at the hardcoded 10bp/side, which is
      # wrong by 0.06x-2.5x depending on the contract — in both directions, so it
      # inverts the ranking between coins. `configs/` lives inside
      # backend/trader precisely so the Docker build context includes it.
      - COST_CONFIG=coinbase_us_perps_cde_v202602.json

      - LEVERAGE=4
      - EQUITY=100000

      # Forecast horizon. Unset falls back to the coin profile's 96h hold, which
      # carries ~70 effective observations against the ~200 the gates need on the
      # ~400 days of CDE history that exist — so the loop could never train a
      # promotable model. 24h with RECENCY_HALF_LIFE_DAYS=365 gives ~280, and is
      # what the cost schedule argues for independently.
      - HORIZON_HOURS=24
      - RECENCY_HALF_LIFE_DAYS=365

      # Scheduling
      - CYCLE_INTERVAL_SECONDS=3600          # Max cycle interval (fallback)
      - CYCLE_ALIGN_MINUTE=3                 # Run at :03 past every hour (1:03, 2:03, ...)
      - INCREMENTAL_BACKFILL_HOURS=6         # Fetch last 6h of data each cycle
      - RETRAIN_EVERY_DAYS=7                 # How long a promoted model stays live
      - WALK_FORWARD_PERIODS=6               # Out-of-sample stretches per evaluation

      # Logging
      - LOG_LEVEL=INFO

      # Optional: HTTP proxy for exchange API calls
      # - HTTPS_PROXY=http://your-proxy:8080
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, psycopg2; psycopg2.connect(os.environ['DATABASE_URL'].replace('postgresql+psycopg2://', 'postgresql://')).close(); print('ok')\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      # Persist the SQLite DB, trained models, feature CSVs, and logs across restarts.
      #
      # These are named volumes, and they are mounted *deeper* than the
      # `./backend/trader:/app` bind below — so Docker layers them on top, and the
      # container never sees a `backend/trader/data` scraped on the host. A store
      # built by hand is invisible here and the loop backfills from scratch into a
      # second, hidden copy. Point TRADER_DATA_MOUNT at the host directory to use
      # it instead (`TRADER_DATA_MOUNT=./backend/trader/data`); the named volume
      # stays the default because `data/` is gitignored, so a bind default would
      # be a path Docker creates empty on a clean clone. Whatever you set, both
      # this service and paper-engine read it — test_deployment.py asserts they
      # cannot diverge.
      - ${TRADER_DATA_MOUNT:-trader_data}:/app/data
      - ${TRADER_MODELS_MOUNT:-trader_models}:/app/models
      - trader_logs:/app/logs
      # Mount source for development (remove in production)
      - ./backend/trader:/app
      # `configs/` already lives inside backend/trader, so the bind mount above
      # brings it in. Mounting a repo-root `./configs` here created an empty
      # host directory and masked the real one, which is exactly the bug the
      # note above describes: find_cost_config() then found nothing and every
      # contract was priced at the hardcoded default.
      # No paper_candidates mount: nothing in the codebase reads that path (it was
      # an overlay for the deleted optimizer scripts). Adding a `.gitkeep` to make
      # the bind source exist satisfied the test without removing the problem —
      # and `.gitignore`'s blanket `data/` rule swallowed the file anyway, so the
      # suite failed from a clean clone while passing locally.
    # The orchestrator: initial backfill (30d) then hourly cycles
    command: >
      -m scripts.live_orchestrator
        --backfill-days 30
        --include-oi

  # ===========================================================================
  # Paper Engine — consumes signals from PostgreSQL and simulates fills
  # ===========================================================================
  paper-engine:
    build:
      context: ./backend/trader
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-trades_db}
      - TZ=America/New_York
      # The paper engine accrues funding from the research store and prices
      # fills from the venue fee schedule. With neither set it read an empty
      # store (so funding was silently never accrued) and fell back to the
      # hardcoded 10bp/side — the two failures its own docstring exists to fix.
      - RESEARCH_STORE=/app/data/research
      - COST_CONFIG=coinbase_us_perps_cde_v202602.json
      # Must match the trader's LEVERAGE. This engine reads config.leverage for
      # the margin it reserves and for the `cash * leverage` cap that clips a
      # signal's contract count, so a mismatch means the book sizes positions
      # differently from the signal writer that produced them.
      - LEVERAGE=4
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
      trader:
        condition: service_started
    volumes:
      # The store the orchestrator writes is the store this reads — same default,
      # same override, or funding is accrued from a store nothing collected into.
      - ${TRADER_DATA_MOUNT:-trader_data}:/app/data
      - ./backend/trader:/app
    command: >
      -m scripts.paper_engine
        --poll-seconds 5
        --max-signal-age-minutes 60

  # ===========================================================================
  # Trader — one-off evaluation (runs once, then exits)
  #
  # Uncomment to walk-forward backtest a candidate, run the simulation stack and
  # print the promotion gates without installing anything. Swap the command for
  # `python -m scripts.promote` to install it if the gates pass, or
  # `python -m scripts.preflight` to check whether the data can train at all.
  # ===========================================================================
  # trader-evaluate:
  #   build:
  #     context: ./backend/trader
  #     dockerfile: Dockerfile
  #   environment:
  #     - TRADER_DB_PATH=/app/data/trading.db
  #     - RESEARCH_STORE=/app/data/research
  #     - LOG_LEVEL=INFO
  #   volumes:
  #     - trader_data:/app/data
  #     - trader_models:/app/models
  #     - trader_logs:/app/logs
  #     - ./backend/trader:/app
  #   command: >
  #     python -m scripts.backtest
  #       --full
  #       --venue coinbase
  #       --cost-config coinbase_us_perps_cde_v202602.json

volumes:
  postgres_data:
  trader_data:
  trader_models:
  trader_logs:
