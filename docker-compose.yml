services:
  # ===========================================================================
  # PostgreSQL — trade history database (for the API/frontend)
  # ===========================================================================
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # No default. A compose file with a working password in it is a password
      # in version control, and this one is reachable from the network below.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-trades_db}
    ports:
      # Bound to the loopback interface. Without the 127.0.0.1 prefix Docker
      # publishes on every interface and punches through the host firewall,
      # which put the trade database on the local network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ===========================================================================
  # Backend API — FastAPI serving prices, trades, wallet to the frontend
  # ===========================================================================
  backend:
    restart: unless-stopped
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    ports:
      # Loopback only: the API serves a local dashboard.
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-trades_db}
      # Comma-separated. `*` is filtered out: it made every other entry
      # decorative and let any open page call the API with credentials.
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://localhost:5173}
      # Where the trader publishes what it alone can measure. The API image has
      # no pyarrow and cannot import the trader package, so dataset freshness is
      # measured on that side (`core/collection_status.py`) and read here as a
      # small JSON document; component liveness is one tiny stamp file each
      # under `alive/`, read live. Absent or old, both come back null with a
      # reason — never as healthy.
      - TRADER_DATA_DIR=/app/trader-data
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/api:/app
      # **Read-only, and the same mount the trader writes.** The whole volume
      # rather than two sub-paths because the default is a NAMED volume
      # (`trader_data`), and a named volume cannot be mounted by sub-path.
      - ${TRADER_DATA_MOUNT:-trader_data}:/app/trader-data:ro
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload

  # ===========================================================================
  # Frontend — React/Vite dashboard
  # ===========================================================================
  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Build arguments, not runtime environment: Vite inlines VITE_* at build
      # time, so a runtime value on a static nginx image reaches nothing.
      args:
        # Default to the relative path nginx already proxies to the backend,
        # which makes the bundle host-agnostic.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      # **Deliberately on every interface, unlike every other service here.**
      # The dashboard is meant to be read from a phone on the house wifi, so
      # loopback would defeat the point. Two things make this the one service
      # it is safe for:
      #
      #   * nginx proxies `/api` to `http://backend:8000` over the DOCKER
      #     network, so the API and Postgres stay bound to 127.0.0.1 and gain
      #     no exposure from this line.
      #   * every route is a read-only GET; `allow_methods` is GET+OPTIONS, so
      #     there is no write surface reachable from here.
      #
      # What it does NOT do is authenticate. `backend/api/security.py` sets
      # CORS and nothing else, and CORS is a browser policy that `curl`
      # ignores -- so anyone on this LAN can read the live account balance,
      # positions and P&L. That is the accepted trade for home access. Do not
      # port-forward this or put it behind a public tunnel without putting
      # real auth in front of it first.
      - "0.0.0.0:3000:80"
    depends_on:
      - backend
    # No runtime environment. Vite inlines `import.meta.env.VITE_*` at BUILD
    # time, so values set here on an nginx image serving a finished bundle are
    # silently ignored — what actually got baked in was the committed
    # `frontend/.env`, which is why every deployment pointed at localhost:8000.
    # It is a `build.args` entry above now.
    # The default `/api` is a relative path that `nginx.conf` already proxies to
    # the backend, so the bundle no longer hardcodes a host at all.
    # `frontend/.env` still applies to `npm run dev`.

  # ===========================================================================
  # Trader — the live loop
  #
  # One service, not two. This replaces the previous orchestrator/paper-engine
  # split, which had a signal writer and a fill simulator that disagreed about
  # what had already happened. `scripts.live` does one cycle end to end: fetch
  # bars, record minute prices, settle what matured, score the current window,
  # price it, decide, act.
  #
  # Defaults to paper mode and places nothing. Going live takes two flags, and
  # they are separate on purpose — see the command block below.
  # ===========================================================================
  trader:
    build:
      context: ./backend/trader
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - COINBASE_API_KEY=${COINBASE_API_KEY:-}
      - COINBASE_API_SECRET=${COINBASE_API_SECRET:-}
      - TZ=America/New_York

      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-trades_db}

      # Research store (Parquet + DuckDB). Absolute, not cwd-relative: a relative
      # path resolved against whatever directory a script started in created a
      # second, empty store that simply went unread.
      - RESEARCH_STORE=/app/data/research
      - MODELS_ROOT=/app/models

      # **Refuse a quote older than 5 seconds.** One variable, read by
      # `core.quotes`, `core.metrics` and `scripts.live` at once. The library
      # default stays 30; the DEPLOYED services take 5, and the `retrain`
      # service sets the same value — they must not differ, or the gates score
      # a sample the account never saw.
      #
      # Why: Predexon serves book CHANGES, so a quiet book is re-reported every
      # later minute and its age climbs by 60s per minute. Measured 2026-10-18,
      # backfill p90 age runs 0.6s at offset 1, 88s at offset 6, 328s at offset
      # 12 and 452s at offset 15 — a quarter of offset-12 rows price against a
      # book last seen five minutes earlier, and a carried-forward price is
      # trivially beatable by a model that sees fresh bars.
      #
      # 5 is the floor that works: `decision_latency_seconds` is 3.0, so every
      # SELECTED quote is ~3s old by construction and a 2s limit keeps 512 rows
      # of 136,673. At 5s, 89.3% survive — live_touch 98.8%, backfill 83.1% —
      # and the drops land where the carry-forward lives (11.9% at offset 3
      # rising to 21.2% at offset 12).
      - QUOTE_MAX_AGE_SECONDS=${QUOTE_MAX_AGE_SECONDS:-5}

      # Kalshi. Only needed for `--mode live`; paper mode never opens a client.
      # Prefer the PATH form — a PEM in an environment variable is a PEM in every
      # process listing.
      - KALSHI_KEY_ID=${KALSHI_KEY_ID:-}
      - KALSHI_PRIVATE_KEY=${KALSHI_PRIVATE_KEY:-}
      # The CONTAINER path, not the host one. `.env` holds a host path for
      # running scripts outside Docker, and passing it through meant the key
      # "existed" and could not be opened — `check_venue` caught exactly that.
      # The PEM is bind-mounted below; KALSHI_PRIVATE_KEY stays unset because a
      # multi-line PEM cannot survive a single .env line, and a PEM in an
      # environment variable is a PEM in every process listing.
      - KALSHI_PRIVATE_KEY_PATH=/run/secrets/kalshi.pem
      - KALSHI_BASE_URL=${KALSHI_BASE_URL:-}
      - KALSHI_SERIES_BTC=${KALSHI_SERIES_BTC:-KXBTC15M}
      - KALSHI_SERIES_ETH=${KALSHI_SERIES_ETH:-KXETH15M}
      - KALSHI_SERIES_SOL=${KALSHI_SERIES_SOL:-KXSOL15M}

      # **No PREDEXON_API_KEY here, deliberately.** The settlement label comes
      # from Kalshi's own `/markets?status=settled`, which carries `result` per
      # market and needs nothing beyond the trading credential already present.
      # Predexon reaches only HISTORY, which Kalshi purges — that is what the
      # 196-day, 62,097-row backfill went through, and it belongs in a research
      # run, not in the container that moves money.

      # Venue fee schedule, resolved by name out of configs/venue. Unset still
      # prices correctly — the built-in defaults are the published Kalshi
      # schedule — but records no version in a model's provenance. `configs/`
      # lives inside backend/trader precisely so the build context includes it.
      - FEE_CONFIG=${FEE_CONFIG:-}

      # Raw-tier retention (`core/spool.py`), applied on each hourly
      # compaction. Book frames and Coinbase trades are the big ones (~0.4-1.1
      # GB/day for the book); the per-second index proxy is tiny and kept a year.
      - RAW_RETENTION_DAYS=${RAW_RETENTION_DAYS:-60}
      - INDEX_PROXY_RETENTION_DAYS=${INDEX_PROXY_RETENTION_DAYS:-365}
      # Its own retention, NOT the 60-day raw tier it used to inherit: at 60
      # days `spot_trades` tops out around 5,760 windows, which is the floor of
      # a usable training window, so it could never have fed a model. ~20 MB a
      # day measured, so a year is ~7 GB.
      - SPOT_TRADES_RETENTION_DAYS=${SPOT_TRADES_RETENTION_DAYS:-365}
      # Free-disk guard on the store volume: below max(fraction x volume, GB)
      # the oldest raw partitions are deleted (book frames first, the index
      # proxy last, never the newest day), logged at ERROR.
      - DISK_GUARD_MIN_FREE_FRACTION=${DISK_GUARD_MIN_FREE_FRACTION:-0.15}
      - DISK_GUARD_MIN_FREE_GB=${DISK_GUARD_MIN_FREE_GB:-20}
      # Venues the `index` component (scripts/record_index.py) connects to.
      # Disable the component entirely with `--disable index`.
      - INDEX_PROXY_EXCHANGES=${INDEX_PROXY_EXCHANGES:-coinbase,kraken,bitstamp,gemini}

      # Optional: HTTP proxy for exchange API calls
      # - HTTPS_PROXY=http://your-proxy:8080
    depends_on:
      db:
        condition: service_healthy
    # **Asserts the loop is WORKING, not that the process exists.** This used to
    # open a Postgres connection and close it: it never touched the trading
    # loop, the venue, the stream or the model, so a wedged process — one
    # abstaining on every window, or scoring all-NaN features — reported
    # `Up (healthy)` indefinitely. Verified: five hours of it.
    #
    # Each component stamps `core.heartbeat` where its loop has demonstrably
    # done its job; this fails when any of them goes quiet for several times its
    # own period. `supervise` already restarts a component that raises or
    # returns — what it cannot see is one that will await forever, which is the
    # websocket deadlock and the untimed subprocess, both of which looked
    # exactly like this.
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.healthcheck", "--quiet"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 300s
    volumes:
      # Persist the scraper DB, the research store, models and logs.
      #
      # These are named volumes mounted *deeper* than the `./backend/trader:/app`
      # bind below, so Docker layers them on top and the container never sees a
      # `backend/trader/data` scraped on the host. A store built by hand is
      # invisible here and the loop backfills from scratch into a second, hidden
      # copy. Point TRADER_DATA_MOUNT at the host directory to use it instead
      # (`TRADER_DATA_MOUNT=./backend/trader/data`); the named volume stays the
      # default because `data/` is gitignored, so a bind default would be a path
      # Docker creates empty on a clean clone.
      - ${TRADER_DATA_MOUNT:-trader_data}:/app/data
      - ${TRADER_MODELS_MOUNT:-trader_models}:/app/models
      - trader_logs:/app/logs
      # Source mount for development (remove in production).
      - ./backend/trader:/app
      # The Kalshi signing key, read-only. Defaults to /dev/null so the other
      # services still start without it; the key load then fails with a clear
      # message rather than a missing-file traceback.
      - ${KALSHI_PEM_PATH:-/dev/null}:/run/secrets/kalshi.pem:ro
    # Paper mode, cycling every minute. It scores, prices and records; it places
    # nothing and needs no Kalshi credentials.
    #
    # To trade for real, two flags, and they are separate deliberately — one flag
    # guarding an irreversible action is one typo away from being wrong:
    #
    #   -m scripts.live --loop --mode live --dry-run        read the real book
    #   -m scripts.live --loop --mode live --place-orders    place orders
    #
    # `--require-gates` is on by default and refuses to trade an artifact whose
    # promotion was blocked. There is no artifact at all until
    # `python -m scripts.promote` installs one, and the loop exits saying so.
    # `--mode live --dry-run` reads the REAL book and places nothing.
    #
    # It is not optional for the promoted artifact: that model was fitted with
    # `init_score_source=market`, so its correction is a residual of the PRICE.
    # Paper mode opens no venue client, `fetch_quotes` returns {}, and every
    # window would score NaN — `config_for_artifact` refuses that combination at
    # startup rather than letting it read as a model that abstains.
    #
    # Add `--place-orders` to trade for real. It stays a separate flag from
    # `--mode live` deliberately: one flag guarding an irreversible action is one
    # typo away from being wrong.
    # ONE process: trade, stream, ladder, pm_ladder, implied_vol, store_sync.
    #
    # `scripts.live` alone is not enough, and the failure is silent. The book
    # features read `record_stream.CACHE`, which is PROCESS-LOCAL — running the
    # recorders in a second container leaves the trading process with an empty
    # cache, so every ladder-derived feature (imbalance_5c, depth_ratio,
    # book_convexity) scores NaN and LightGBM substitutes a learned default.
    # That is a different model from the one whose gates were measured, and it
    # says so in the log rather than crashing.
    #
    # `--mode live --dry-run` reads the REAL book and places nothing. Live mode
    # is not optional here: the promoted artifact was fitted with
    # init_score_source=market, so its correction is a residual of the PRICE,
    # and paper mode opens no venue client at all.
    #
    # `--place-orders` is LIVE MONEY. It stays a separate flag from
    # `--mode live` deliberately: one flag guarding an irreversible action is
    # one typo away from being wrong. Remove it to go back to reading the book
    # and placing nothing.
    #
    # `--bankroll 500` must track the funded account, and it is NOT what sizes
    # positions: the loop runs `--compound`, so `sizing_base = bankroll if
    # config.compound else config.starting_bankroll` takes the LIVE balance.
    # What this sets is the BREAKERS — the ruin floor is
    # `starting_bankroll * ruin_floor_fraction` (0.50), and the daily-loss limit
    # is `max_daily_loss_fraction * starting_bankroll` (0.15).
    #
    # **Update it whenever money moves.** When a manual withdrawal took the
    # account $1,046 -> $196 on 2026-09-20 and this still read 1045, the floor
    # sat at $522 against a real $196: every decision was refused
    # `bankroll_floor` for four days. From inside the system a withdrawal is
    # indistinguishable from ruin, which is the right thing for it to assume and
    # the wrong conclusion there.
    #
    # It also sets the effective EDGE gate, through the whole-contract floor.
    # `decide()` floors the stake to whole contracts, so a bankroll too small to
    # afford one contract refuses the trade outright — measured at $196, a
    # mid-priced market needed 2.56pp to afford a single contract against a
    # configured `--min-edge-pp 1.5`, so the account size was the binding gate
    # and the trade rate went to zero. At $500 that falls to ~0.96pp, safely
    # below 1.5, so `min_edge_pp` binds as intended.
    #
    # Guardrails at $500: halt below $250, halt on a $75 daily loss, $40 max
    # stake per trade, 3 positions per window.
    command: >
      -m scripts.run_live
        --trade-args
        --loop
        --cycle-seconds 60
        --mode live
        --place-orders
        --compound
        --bankroll 500
        --max-stake-dollars 40
        --min-edge-pp 0.5
        --kelly-fraction 0.05

  # ===========================================================================
  # Scrape — one-off, runs to completion then exits
  #
  # Phase 0. Five years of one-minute bars for the three symbols: ~2.6M minutes
  # each, ~8,800 requests each, a few hours. Resumable — an interrupted run
  # continues rather than restarting, and a re-run on a populated store fetches
  # only what is missing at either end.
  #
  #   docker compose run --rm scrape
  #   docker compose run --rm scrape -m scripts.sync_store
  # ===========================================================================
  scrape:
    profiles: ["tools"]
    build:
      context: ./backend/trader
      dockerfile: Dockerfile
    environment:
      - COINBASE_API_KEY=${COINBASE_API_KEY:-}
      - COINBASE_API_SECRET=${COINBASE_API_SECRET:-}
      - RESEARCH_STORE=/app/data/research
    volumes:
      - ${TRADER_DATA_MOUNT:-trader_data}:/app/data
      - ./backend/trader:/app
    command: >
      -m scripts.scrape
        --backfill-days 1825

  # ===========================================================================
  # Evaluate — one-off. Walk-forward, gates, cost stress. Installs nothing.
  #
  #   docker compose run --rm evaluate
  #   docker compose run --rm evaluate -m scripts.baseline       # read this first
  #   docker compose run --rm evaluate -m scripts.promote        # install if it passes
  #   docker compose run --rm evaluate -m scripts.promote --history
  # ===========================================================================
  evaluate:
    profiles: ["tools"]
    build:
      context: ./backend/trader
      dockerfile: Dockerfile
    environment:
      - RESEARCH_STORE=/app/data/research
      - MODELS_ROOT=/app/models
      - FEE_CONFIG=${FEE_CONFIG:-}
      # `scripts.promote` mirrors each attempt into the serving store so the
      # dashboard's Model and Calibration pages have something to render. Without
      # this it logs "DATABASE_URL is unset, so the dashboard will not show this
      # attempt" and both tabs stay empty after a *successful* promotion — which
      # looks like a broken page rather than a missing variable.
      #
      # The ledger under models/promotions/ remains the record of account; this is
      # only the dashboard's copy, and promotion does not depend on the database
      # being reachable.
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-trades_db}
    volumes:
      - ${TRADER_DATA_MOUNT:-trader_data}:/app/data
      - ${TRADER_MODELS_MOUNT:-trader_models}:/app/models
      - ./backend/trader:/app
    command: >
      -m scripts.evaluate

  # ===========================================================================
  # Retrain — weekly, gated, one-off. Driven by ops/weekly_retrain.sh via cron.
  #
  # `scripts.promote` runs the walk-forward, scores the gates and installs ONLY
  # if they all pass; exit 0 means installed, 1 means refused. There is no
  # `--force` here on purpose. The deployed artifact was force-promoted past
  # `calibration_error` 0.0216, and that gate has since been traced to a real
  # cost: measured live 2026-09-10, the fitted baseline is the worst calibrated
  # of the three forecasters (over-confidence +0.0362 against the market's
  # +0.0252, every one of six buckets pushed away from 0.5), and `base - mkt`
  # at +12m reads -0.0139. An automatic job must not repeat an override that a
  # human made once with a written reason.
  #
  # The config is pinned to what is LIVE so a retrain changes one thing — the
  # data it saw. Groups are cell 63; the 2026-09-04 sweep's alternative (cell
  # 21) was measured better on forecast metrics and worse on realised edge and
  # drawdown, and deliberately not adopted.
  #
  # **It had drifted, and the drift was silent.** Measured 2026-10-18, this read
  # `--entry-offsets 12 --kelly-fraction 0.05` with no `--compound`, while the
  # account traded first-clear across 3/6/9/12 at 0.10 Kelly, compounding. So
  # every Sunday the gates scored a policy nobody ran — the defect this repo
  # names as "an evaluation measuring one system while another trades".
  # Re-aligned; anything changed in the trader's override must be changed here
  # in the same commit.
  #
  # `book_flow` joins the groups on evidence: through `scripts/evaluate` over
  # 2026-01-08..10-17 it took log-loss skill +0.002370 -> +0.002455 (p 1.2e-5 ->
  # 3.7e-6) and, more to the point, cut P&L concentration — the top three
  # windows fell from 507% of total to 116%, i.e. the control LOST money
  # excluding its best three windows and this does not. It carries the two new
  # `mid_change_*` terms: the group tracked imbalance, depth and spread but
  # never the mid, which is the market revising its own probability.
  #
  # **The ensemble and label flags are here so the gates stop turning
  # themselves off.** `scripts/live.py` adopts `edge_lower_bound_z`,
  # `require_member_agreement` and `init_score_source` from the installed
  # artifact's provenance, and skips any value equal to the default. The
  # deployed artifact records ensemble_size 5, label_source venue,
  # edge_lower_bound_z 1.0 and require_member_agreement True; this command
  # passed NONE of them, so the next promotion would have written the defaults
  # (1 / proxy / 0.0 / False) and live would have silently dropped two real
  # refusal gates — `Reason.EDGE_UNCERTAIN` and `Reason.MEMBERS_DISAGREE` — at
  # the next window boundary, with no log line and no restart. `label_source
  # venue` also matters on its own: grading on the Coinbase proxy is a measured
  # leak (72.77% against 56.17% win rate).
  #
  # `--max-stake-dollars 40` matches the trader's override. It is the depth cap
  # the economics apply; at 25 the gates would measure a strategy sized 37.5%
  # smaller than the one trading.
  #
  # **`--start 2025-10-01`, and what it does NOT fix.** Without it this loaded
  # 2,707,180 minutes per symbol for a model that `--complete-cases` can only
  # score on the book era (`venue_depth` begins 2026-01-07). The date is set by
  # the longest lookback, not by taste: `seasonality_min_days` is 60, the
  # longest rolling feature is 1,440 minutes and `embargo_minutes` is 1,440, so
  # ~62 days of padding is the minimum and this leaves 98.
  #
  # It does not make the MONEY gates honest. `venue_depth` before 2026-08-25 is
  # Predexon backfill, which is unbiased but 54x noisier than the live book and
  # stamped a minute late — not an executable price. Measured 2026-10-18 over
  # one walk-forward: P&L split **+$3,493.94 (t=+3.95) on backfilled quotes
  # against -$55.03 (t=-0.12) on live-recorded ones**, and the 0-20c band
  # reversed sign entirely (+5.98pp/ct backfill, -4.82pp/ct live). `decide()`
  # selects rows where `q - ask` is large, so a noisy ask makes it
  # preferentially pick prices that never existed.
  #
  # The MARKET gates are already protected — `scripts/promote.py:114` passes
  # `recorded_only=True`, so `model_minus_market`, `model_minus_market_p`,
  # `calibration_vs_market` and `directional_tilt_abs` see live quotes only.
  # `realised_edge_pp`, `total_return`, `sharpe` and `max_drawdown` do not, and
  # should be read as an upper bound until live recording covers more than the
  # 51 days it has. Cutting `--start` to 2026-08-25 would fix them and leaves
  # too little to fit 55 features: measured, training on live-only quotes gives
  # `log_loss_skill` **-0.000118 (p=0.80)**, i.e. no skill at all.
  #
  # `--max-entries-per-symbol-window 4` / `--max-positions-per-window 12`
  # mirror the trader override's multi-entry experiment of 2026-10-20: the
  # account takes one entry per decision offset instead of the first that
  # clears. Grading first-clear here while the account runs multi-entry is the
  # exact drift `tests/test_deployed_config_parity.py` exists to catch, and the
  # defect already recorded in this file from 2026-10-18. Both flags move
  # together -- at 3, `max_positions_per_window` is saturated by one entry on
  # each of three symbols, so the per-symbol limit alone changes nothing.
  # `decide()` is shared, so the same-side constraint (`OPPOSITE_SIDE`) applies
  # here too: the backtest cannot buy both sides of a window either.
  #
  # `--exclude-price-band 0.35,0.65` puts a hole in the middle of the book,
  # where the fee `0.07*p(1-p)` peaks and the measured signal is ~0. On live
  # quotes that band alone was -$393 (-2.38pp/ct) while excluding it took the
  # whole book from -$55 to +$297. Symmetric, and `Config.__post_init__`
  # refuses an off-centre hole for the same reason the outer band is symmetric.
  #
  # **Promoting DOES affect trading, at the next window boundary.** This said
  # "`live.py` calls `load_live` once at startup and never reloads", which was
  # true once and is not now: `scripts/live.py` calls `reload_if_changed` on the
  # first cycle of each window, so a newly installed artifact is picked up with
  # no restart. `ops/weekly_retrain.sh` already said so; this comment had
  # drifted and the two contradicted each other — corrected 2026-10-18.
  # ===========================================================================
  retrain:
    profiles: ["tools"]
    build:
      context: ./backend/trader
      dockerfile: Dockerfile
    environment:
      - RESEARCH_STORE=/app/data/research
      - MODELS_ROOT=/app/models
      # Identical to the trader's, deliberately — see the long note there. A
      # retrain scoring quotes the account would refuse is grading a sample the
      # account never sees, which is the drift this file keeps getting caught
      # by. Change one and change the other in the same commit.
      - QUOTE_MAX_AGE_SECONDS=${QUOTE_MAX_AGE_SECONDS:-5}
      - FEE_CONFIG=${FEE_CONFIG:-}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-trades_db}
    volumes:
      - ${TRADER_DATA_MOUNT:-trader_data}:/app/data
      - ${TRADER_MODELS_MOUNT:-trader_models}:/app/models
      - ./backend/trader:/app
    command: >
      -m scripts.promote
        --groups cross_venue,geometry,vol_state,microstructure,cross_asset,offset,market_state,implied_vol,book_flow
        --start 2025-10-01
        --complete-cases
        --entry-offsets 3 6 9 12
        --init-score-source market
        --kelly-fraction 0.10
        --compound
        --min-edge-pp 0.5
        --bankroll 500
        --exclude-price-band 0.35,0.65
        --max-entries-per-symbol-window 4
        --max-positions-per-window 12
        --maker-entry
        --max-stake-dollars 40
        --ensemble-size 5
        --label-source venue
        --edge-lower-bound-z 1.0
        --require-member-agreement
        --quote-sources live_touch,live_ws,live,live_ws_replay,candles
        --peer-quote-sources all
        --force
        --reason "Standing operator policy, 2026-10-21: the Sunday retrain ALWAYS installs, so the model keeps absorbing new data. The gates are advisory and the operator reads them; they are not a blocker. Quote sources are Kalshi-only for price VALIDITY rather than measured skill - the Predexon backfill is unbiased but 54x noisier, stamped a minute late, and quantises the deci-cent tail grid to whole cents in ~27% of rows, so a model trained to beat it may not transfer to a book we can trade. It scores worse on the gates and that is accepted. --peer-quote-sources all keeps Polymarket intact: the source filter matches on the bare name and would otherwise discard the gamma backfill, which is a different pipeline, taking every cross_venue row with it."


volumes:
  postgres_data:
  trader_data:
  trader_models:
  trader_logs:
